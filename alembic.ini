# Alembic configuration for Telegram-Finance-Bot V2 (docs/10 §3).
#
# Deliberately contains NO database URL and NO credentials. Connection settings come only from
# FINBOT_* variables validated by finbot.migration_settings (owner role, password file only).
# Use the `finbot-migrate` entry point; plain `alembic` works too and is guarded by the same
# migrations/env.py (downgrade/stamp refused outside dev/test/drill, autogenerate refused).
#
# New revision (manual, deterministic id; no autogenerate):
#   uv run alembic revision --rev-id 0002 -m "short description"

[alembic]
script_location = %(here)s/migrations
# Files are named NNNN_<slug>.py (checked by finbot.infra.db.migration_runtime).
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
# env.py is not run for `alembic revision`; the revision policy is enforced on every
# upgrade/downgrade/current run and by tests/unit/test_migration_env.py.
revision_environment = false
path_separator = os
output_encoding = utf-8

# Logging is configured by finbot.logging (JSON + redaction), not by fileConfig here.
