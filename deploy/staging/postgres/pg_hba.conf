# Telegram-Finance-Bot V2 STAGING client authentication (mounted read-only; hba_file=...).
# Replaces the image's generated "host all all all scram-sha-256" catch-all.
# First matching line wins. No trust/peer/md5/password methods. Checked by
# tests/deploy/test_staging_compose.py.
#
# Addresses are explicit (not "samenet") so that joining another network can never widen access:
#   127.0.0.1/32       loopback inside the postgres container only (healthcheck, `docker exec`)
#   172.31.250.0/27    finbot-staging_db (compose.yml ipam), the only network postgres joins
#   172.31.250.1/32    that network's gateway address: the host side of the bridge. Gateway
#                      mode "isolated" assigns it to nothing; rejected here as defence in depth.
#
# TYPE  DATABASE        USER                                                    ADDRESS           METHOD

# Superuser: only from inside the container (initdb scripts, break-glass via `docker exec`),
# always with a password. Never from any network.
local   all             postgres                                                                  scram-sha-256
host    all             postgres                                                127.0.0.1/32      scram-sha-256
local   all             all                                                                       reject
host    all             postgres                                                all               reject
host    all             all                                                     172.31.250.1/32   reject

# Application roles: only the staging database. finbot_readonly is NOLOGIN unless break-glass
# enables it. Loopback allows operator maintenance via `docker exec` (e.g. a manual pg_dump).
host    finbot_staging  finbot_owner,finbot_app,finbot_backup,finbot_readonly  172.31.250.0/27   scram-sha-256
host    finbot_staging  finbot_owner,finbot_app,finbot_backup,finbot_readonly  127.0.0.1/32      scram-sha-256

# Everything else (other databases, replication, unknown roles, any other source).
host    all             all                                                     all               reject
host    replication     all                                                     all               reject
