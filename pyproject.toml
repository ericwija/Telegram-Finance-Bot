# Telegram-Finance-Bot V2 ("finbot").
# V1 (main.py, requirements.txt, Dockerfile, docker-compose.yml) is independent and is not
# packaged or managed by this file.

[project]
name = "finbot"
version = "2.0.0.dev0"
description = "Telegram-first personal & business finance (V2)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "tzdata>=2024.1",  # zoneinfo data independent of the host/container OS
    # Database (Step 3B, decision S3): SQLAlchemy 2.x async + asyncpg; Alembic runs as finbot_owner.
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    # Telegram (Step 4C): long polling via the async Application; httpx transport.
    "python-telegram-bot>=22.8,<23",
]

[project.scripts]
finbot = "finbot.__main__:main"
finbot-migrate = "finbot.adapters.cli.migrate:main"  # owner-role entry point (decision S10)
finbot-admin = "finbot.adapters.cli.admin:main"  # app-role platform-admin operations (Step 4B)

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8,<5",  # CI database backend (pinned image digest)
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# --------------------------------------------------------------------------- uv
[tool.uv]
required-version = ">=0.12,<0.13"

# ------------------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["main.py"]  # V1 is frozen and not linted by V2 tooling

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "DTZ", "T20",
    "SIM", "RUF", "PL", "PT", "C4", "PIE", "RET", "TID", "BLE",
]
ignore = [
    "PLR0913",  # settings/CLI functions legitimately take many keyword arguments
]

[tool.ruff.lint.per-file-ignores]
# N802: test names embed doc IDs (test_AT_CFG_01_...). S105/S106: deliberately fake secrets.
# PLR0917: parametrized tests take one positional argument per parameter.
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "N802", "PLR2004", "PLR0917"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["finbot"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ----------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
pythonpath = ["."]  # makes the `tests` package importable for shared helpers
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
asyncio_mode = "strict"  # async tests/fixtures must opt in explicitly
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "db: needs a disposable PostgreSQL 18.6 cluster (FINBOT_TEST_PG_BACKEND; docs/10 §4)",
    "slow: long-running test",
]

[tool.coverage.run]
source = ["finbot"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

# ---------------------------------------------------------------- import-linter
# Layering contract from docs/04-LOGICAL-ARCHITECTURE.md §3 (NFR-MNT-01).
[tool.importlinter]
root_package = "finbot"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture: adapters > services > authz > domain"
type = "layers"
layers = [
    "finbot.adapters",
    "finbot.services",
    "finbot.authz",
    "finbot.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is pure: no infrastructure, adapters, config or frameworks"
type = "forbidden"
source_modules = ["finbot.domain"]
forbidden_modules = [
    "finbot.infra",
    "finbot.adapters",
    "finbot.services",
    "finbot.ports",
    "finbot.config",
    "pydantic_settings",
    "telegram",
    "sqlalchemy",
]

[[tool.importlinter.contracts]]
name = "Services and authz never depend on infrastructure or adapters (use ports)"
type = "forbidden"
source_modules = ["finbot.services", "finbot.authz"]
forbidden_modules = ["finbot.infra", "finbot.adapters", "telegram", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "Channel adapters are independent of each other"
type = "independence"
modules = [
    "finbot.adapters.telegram",
    "finbot.adapters.cli",
    "finbot.adapters.jobs",
]
